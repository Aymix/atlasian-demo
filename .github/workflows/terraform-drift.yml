################################################################################
# Terraform Drift Detection
# Scheduled workflow that runs terraform plan on all stacks against main
# to detect configuration drift (changes made outside of Terraform).
################################################################################

name: "Terraform Drift Detection"

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write
  id-token: write

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.9.x"

jobs:
  drift:
    name: "Drift Check — ${{ matrix.stack }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [vpc, iam, ecr, alb, ecs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform -chdir=stacks/${{ matrix.stack }} init -input=false -no-color

      - name: Terraform Plan (detect drift)
        id: plan
        run: |
          terraform -chdir=stacks/${{ matrix.stack }} plan \
            -input=false \
            -no-color \
            -detailed-exitcode 2>&1 | tee /tmp/drift-output.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Create issue if drift detected
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/drift-output.txt', 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔀 Drift detected in stack: ${{ matrix.stack }}`,
              body: `## Terraform Drift Detected

            **Stack:** \`${{ matrix.stack }}\`
            **Detected:** ${new Date().toISOString()}
            **Workflow:** [Run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            <details><summary>Plan output</summary>

            \`\`\`hcl
            ${output.substring(0, 65000)}
            \`\`\`

            </details>

            ### Next Steps
            1. Review the drift above
            2. If intentional, update Terraform to match
            3. If unintentional, run \`atlantis apply\` to restore desired state
            `,
              labels: ['drift', 'terraform', '${{ matrix.stack }}']
            });
